<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fefefe"><title>Ground-breaking</title>
<meta name="author" content="Hal Xing">
<meta name="robots" content="noindex">
<style>
/* Look taken from hal-xing.github.io/web-projects/ground-breaking (white ground, small square photos, right-hand caption). */
html,body{margin:0;height:100%;background:#fefefe;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#root{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0;background:#fefefe;perspective:900px;perspective-origin:50% 0}
#tilt{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 0}
#strip{position:absolute;left:0;top:0;will-change:transform}
#strip img{position:absolute;display:block;object-fit:cover;opacity:0;transition:opacity .3s ease}
#strip img.on{opacity:1}
#info{position:absolute;top:50%;right:10px;transform:translateY(-50%);z-index:5;max-width:60%;text-align:right;pointer-events:none;
 font:12px/1.4 "Roboto",-apple-system,BlinkMacSystemFont,sans-serif;color:rgba(0,0,0,.85)}
#info div+div{margin-top:4px;color:rgba(0,0,0,.7)}
#out{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;opacity:0;pointer-events:none;transition:opacity .6s ease;
 font:12px/1.4 "Roboto",-apple-system,BlinkMacSystemFont,sans-serif;background:rgba(254,254,254,.94);padding:7px 10px 8px}
#out.on{opacity:1;pointer-events:auto;transition-duration:.25s}
#out a{display:block;color:rgba(0,0,0,.85);text-decoration:none;padding:3px 0}#out a+a{color:rgba(0,0,0,.7)}
#dbg{position:fixed;left:6px;bottom:6px;font:11px/1.3 monospace;color:#080;z-index:9;white-space:pre}
.mk{position:absolute;background:#f0f;z-index:6}
</style></head><body>
<div id="root"><div id="tilt"><div id="strip"></div></div><div id="info"></div><div id="out"><a href="https://hal-xing.github.io/">Hal Xing</a><a href="https://hal-xing.github.io/web-projects/ground-breaking/">Ground-breaking</a></div></div><div id="dbg"></div>
<script>
// Ground-breaking NFC page, v2: Hal's homepage crack scroller, with the line pinned where it meets the screen's entry edge.
// Knobs in the address: speed, hold, first, size, mm, dir, cx, smooth, tilt, bg, info=0, debug=1, only=approved.
const Q=new URLSearchParams(location.search),num=(k,d)=>{const v=parseFloat(Q.get(k));return isNaN(v)?d:v};
const SPEED=num("speed",128),HOLD=num("hold",1.2),MM=num("mm",0),PPMM=num("ppmm",6.1),SIZE=num("size",0),CX=num("cx",0),SMOOTH=num("smooth",60),TILT=num("tilt",0),
 DIR=Q.get("dir")||"auto",FLOW=Q.get("chain")==="flow",FIRST=(Q.get("first")||"").replace(/\.jpe?g$/i,""),ONLY=Q.get("only")==="approved",INFO=Q.get("info")!=="0",DEBUG=Q.get("debug")==="1";
const root=document.getElementById("root"),tilt=document.getElementById("tilt"),strip=document.getElementById("strip"),info=document.getElementById("info"),dbg=document.getElementById("dbg");
if(Q.get("bg"))document.body.style.background=root.style.background="#"+Q.get("bg").replace("#","");
if(TILT)tilt.style.transform=`rotateX(${-TILT}deg)`;if(!INFO)info.style.display="none";
const base=location.pathname.endsWith("/")?location.pathname:location.pathname+"/";
let POOL=[],items=[],pts=[],S=0,Vw=0,Vh=0,y=0,t0=0,paused=false,running=false,seq=0,lastPick=-1,shown=null;
// items: {el,x,y,m} in units of S (photo size); pts: the line, [x,y] in units of S. Units of S so a resize keeps everything joined.
function dirNow(){return DIR==="auto"?"down":DIR}
function photoSize(){if(MM)return MM*PPMM;if(SIZE)return SIZE;return Vw<=400?Math.min(Vw*.6,250):Vw<768?Math.min(Vw*.5,300):Vw<=900?400:500}   // homepage's --image-size rules
function layout(){
  const d=dirNow(),W=innerWidth,H=innerHeight,side=d==="left"||d==="right",old=S;
  Vw=side?H:W;Vh=side?W:H;S=photoSize();root.style.width=Vw+"px";root.style.height=Vh+"px";
  root.style.transform=d==="down"?"":d==="right"?`translate(0,${H}px) rotate(-90deg)`:d==="left"?`translate(${W}px,0) rotate(90deg)`:`translate(${W}px,${H}px) rotate(180deg)`;
  if(old)y*=S/old;items.forEach(place)}
function place(it){const e=it.el;e.style.width=e.style.height=S+"px";e.style.left=it.x*S+"px";e.style.top=it.y*S+"px"}
function pick(){
  if(FLOW||!items.length&&FIRST){let i=FLOW?seq%POOL.length:POOL.findIndex(m=>m.n.replace(/\.jpe?g$/i,"")===FIRST);if(!FLOW&&i<0)i=0;if(FLOW&&!seq&&FIRST){const k=POOL.findIndex(m=>m.n.replace(/\.jpe?g$/i,"")===FIRST);if(k>0)seq=i=k}return i}
  let i;do{i=Math.floor(Math.random()*POOL.length)}while(POOL.length>1&&i===lastPick);return i}
function add(){
  const i=pick(),m=POOL[i];lastPick=i;seq++;const end=pts.length?pts[pts.length-1]:[0,0];
  const L=m.q&&m.q.length>1?m.q:[[m.p[0],m.p[1]],[m.p[2],m.p[3]]];   // the line inside this photo: Hal-approved trace, else straight entry to exit
  const it={m,x:end[0]-L[0][0],y:end[1]-L[0][1]};   // this photo's entry point sits on the last photo's exit point
  if(!pts.length)pts.push([end[0],end[1]]);for(let k=1;k<L.length;k++)if(it.y+L[k][1]>pts[pts.length-1][1])pts.push([it.x+L[k][0],it.y+L[k][1]]);
  const e=document.createElement("img");e.alt="";e.decoding="async";e.draggable=false;e.onload=()=>e.classList.add("on");e.src=m.src;it.el=e;place(it);strip.append(e);items.push(it)}
function lineX(yy){   // x of the line at height yy (units of S)
  if(yy<=pts[0][1])return pts[0][0];
  for(let k=1;k<pts.length;k++)if(yy<=pts[k][1]){const a=pts[k-1],b=pts[k];return a[0]+(b[0]-a[0])*(yy-a[1])/(b[1]-a[1])}
  return pts[pts.length-1][0]}
function pinX(yy){if(!SMOOTH)return lineX(yy);const n=Math.max(3,Math.ceil(SMOOTH/3)),w=SMOOTH/S;let s=0,t=0;   // weighted average of the line over +-SMOOTH px of travel, sampled every ~3 px, so small zig-zags in a trace do not shake the picture
  for(let k=-n;k<=n;k++){const g=1-Math.abs(k)/(n+1);s+=g*lineX(yy+k*w/n);t+=g}return s/t}
function manage(){
  const top=y/S,need=top+(Vh/S)*(TILT?8:1)+2;let guard=0;
  while(pts[pts.length-1][1]<need&&guard++<40)add();
  while(items.length>3&&items[0].y+1<top-1){items.shift().el.remove()}
  while(pts.length>3&&pts[1][1]<top-2)pts.shift()}
function caption(){
  if(!INFO)return;const mid=(y+Vh/2)/S;let best=null,bd=1e9;for(const it of items){const d=Math.abs(it.y+.5-mid);if(d<bd){bd=d;best=it}}
  if(!best||best===shown)return;shown=best;const m=best.m;let a=m.t||"";if(m.c&&m.c.length===2)a+=(a?" ":"")+`(${m.c[0].toFixed(4)}, ${m.c[1].toFixed(4)})`;
  info.textContent="";const d1=document.createElement("div");d1.textContent=a;info.append(d1);if(m.l){const d2=document.createElement("div");d2.textContent=m.l;info.append(d2)}}
function draw(){manage();strip.style.transform=`translate3d(${Vw/2+CX-pinX(y/S)*S}px,${-y}px,0)`;caption();
  if(DEBUG)dbg.textContent=`dir ${dirNow()}  size ${S.toFixed(0)}px  speed ${SPEED}  photos ${items.length}  ${shown?shown.m.n:""}\nscreen ${innerWidth}x${innerHeight}  dpr ${devicePixelRatio}`}
let last=0;
function frame(now){
  if(!last)last=now;const dt=Math.min(.1,(now-last)/1000);last=now;
  if(POOL.length&&!paused){if(!running){if((now-t0)/1000>=HOLD)running=true}else y+=SPEED*dt;draw()}
  requestAnimationFrame(frame)}
let wl=null;async function wake(){try{if("wakeLock"in navigator&&document.visibilityState==="visible")wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);addEventListener("pointerdown",()=>{wake()});
addEventListener("resize",()=>{layout();if(POOL.length)draw()});
addEventListener("dblclick",()=>{paused=!paused});
// Way out to Hal's other pages: nothing on screen until a tap, then a small label for 5 s (Hal 2026-11-14: hidden page, but people can go on from it).
const out=document.getElementById("out");let outT=0;addEventListener("click",e=>{if(e.target.closest("#out a"))return;out.classList.add("on");clearTimeout(outT);outT=setTimeout(()=>out.classList.remove("on"),5000)});
const load=fetch("meta.json").then(r=>r.json()).then(j=>Object.keys(j).filter(n=>!ONLY||j[n].q).map(n=>Object.assign({n,c:[],l:"",t:""},j[n],{src:"img/"+(j[n].f||n+".jpg")})));
load.then(P=>{POOL=P;if(!POOL.length){dbg.textContent="no approved photos yet";return}layout();
  if(DEBUG){const m=document.createElement("div");m.className="mk";m.style.cssText=`left:calc(50% + ${CX}px);top:0;width:1px;height:30px`;root.append(m)}
  add();y=pts[0][1]*S;t0=performance.now();draw();wake();requestAnimationFrame(frame)}).catch(()=>{dbg.textContent="could not load"});
</script></body></html>
