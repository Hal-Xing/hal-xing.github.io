<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fefefe"><title>Ground-breaking</title>
<meta name="author" content="Hal Xing">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/common.css"><link rel="stylesheet" href="/assets/css/site-nav.css">
<style>
/* Look taken from hal-xing.github.io/web-projects/ground-breaking (white ground, small square photos, right-hand caption). */
html,body{margin:0;height:100%;background:#fefefe;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#root{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0;background:#fefefe;perspective:900px;perspective-origin:50% 0}
#tilt{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 0}
#strip{position:absolute;left:0;top:0;will-change:transform}
#strip img{position:absolute;display:block;object-fit:cover;opacity:0;transition:opacity .3s ease}
#strip img.on{opacity:1}
#info{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;max-width:44%;text-align:right;pointer-events:none;text-shadow:0 0 2px #fefefe,0 0 3px #fefefe,0 0 5px #fefefe;   /* small, bottom-right corner, no box: stays right of the crack line (Hal 2026-11-15: the box blocked the images) */
 font:10px/1.35 "Roboto",-apple-system,BlinkMacSystemFont,sans-serif;color:rgba(0,0,0,.85)}
#info span{display:inline-block;white-space:nowrap}
#info div+div{margin-top:1px;color:rgba(0,0,0,.7)}
#out{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;opacity:0;pointer-events:none;transition:opacity .6s ease;
 font:12px/1.4 "Roboto",-apple-system,BlinkMacSystemFont,sans-serif;background:rgba(254,254,254,.94);padding:7px 10px 8px}
#out.on{opacity:1;pointer-events:auto;transition-duration:.25s}
#out a{display:block;color:rgba(0,0,0,.85);text-decoration:none;padding:3px 0}#out a+a{color:rgba(0,0,0,.7)}
#dbg{position:fixed;left:6px;bottom:6px;font:11px/1.3 monospace;color:#080;z-index:9;white-space:pre}
.mk{position:absolute;background:#f0f;z-index:6}
/* experiments behind address switches (2026-11-15, not the default): fs=1, bar=, under=1, scroll=manual */
#fsx{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:8;display:none;width:34px;height:34px;border:0;border-radius:17px;padding:0;background:rgba(254,254,254,.82);color:rgba(0,0,0,.6);font:20px/34px -apple-system,sans-serif}
#fsx.on{display:block}
html.man,html.man body{overflow:visible;height:auto}
html.man #root{perspective:none}html.man #info,html.man #out{position:fixed}
#hint{position:fixed;left:10px;bottom:calc(46px + env(safe-area-inset-bottom));z-index:6;font:11px/1.3 "Roboto",-apple-system,sans-serif;color:rgba(0,0,0,.7);text-shadow:0 0 2px #fefefe,0 0 4px #fefefe;pointer-events:none}
/* The site's own menu from /assets/js/site.js (Hal 2026-11-20): same bar and sidebar as the Ground Breaking page, invisible until a tap */
body.has-site-nav{padding-bottom:0!important}
/* Hal 2026-11-21: "Hal Xing" always stays where it is on every other page (desktop sidebar top-left, phone bar bottom-right); the rest of the menu shows on a tap */
.sidebar,.mobile-menu{pointer-events:none}.site-home{pointer-events:auto}
.sidebar>:not(header),.mobile-menu .page-path-container,.mobile-content{opacity:0;transition:opacity .6s ease}
.mobile-menu{background-color:transparent;border-top-color:transparent;transition:background-color .6s ease,border-color .6s ease}
.mobile-header>div:last-child{text-shadow:0 0 2px #fefefe,0 0 3px #fefefe,0 0 5px #fefefe}
body.menu-on .sidebar,body.menu-on .mobile-menu{pointer-events:auto}
body.menu-on .sidebar>*,body.menu-on .mobile-menu .page-path-container,body.menu-on .mobile-content{opacity:1;transition-duration:.25s}
body.menu-on .mobile-menu{background-color:var(--almost-white);border-top-color:var(--border-color);transition-duration:.25s}
body.menu-on .sidebar,body.menu-on .mobile-menu{opacity:1;pointer-events:auto;transition-duration:.25s}
body.has-site-nav #out{display:none}
.mobile-header>div{white-space:nowrap}   /* WebKit wrapped "Ground Breaking" onto a second line here */
@media (max-width:768px){body.has-site-nav #info{bottom:calc(54px + env(safe-area-inset-bottom))}}   /* the caption sits above the bar, clear of "Hal Xing" */
</style></head><body>
<div id="root"><div id="tilt"><div id="strip"></div></div><div id="info"></div><div id="out"><a href="https://hal-xing.github.io/">Hal Xing</a><a href="https://hal-xing.github.io/web-projects/ground-breaking/">Ground-breaking</a></div></div><div id="dbg"></div>
<script>
// Ground-breaking NFC page, v2: Hal's homepage crack scroller, with the line pinned where it meets the screen's entry edge.
// Knobs in the address: speed, hold, first, size, mm, dir, cx, smooth, tilt, bg, info=0, debug=1, only=approved.
const Q=new URLSearchParams(location.search),num=(k,d)=>{const v=parseFloat(Q.get(k));return isNaN(v)?d:v};
const SPEED=num("speed",128),HOLD=num("hold",1.2),MM=num("mm",0),PPMM=num("ppmm",6.1),SIZE=num("size",0),CX=num("cx",0),SMOOTH=num("smooth",60),TILT=num("tilt",0),
 DIR=Q.get("dir")||"auto",FLOW=Q.get("chain")==="flow",FIRST=(Q.get("first")||"").replace(/\.jpe?g$/i,""),ONLY=Q.get("only")==="approved",INFO=Q.get("info")!=="0",DEBUG=Q.get("debug")==="1";
const root=document.getElementById("root"),tilt=document.getElementById("tilt"),strip=document.getElementById("strip"),info=document.getElementById("info"),dbg=document.getElementById("dbg");
if(Q.get("bg"))document.body.style.background=root.style.background="#"+Q.get("bg").replace("#","");
const MAN=Q.get("scroll")==="manual"&&!FLOW,SPD=Q.has("speed")?SPEED:MAN?40:SPEED,KEEP=MAN?40:1,SPACER=2e6;
if(TILT)tilt.style.transform=`rotateX(${-TILT}deg)`;if(!INFO)info.style.display="none";
const base=location.pathname.endsWith("/")?location.pathname:location.pathname+"/";
let POOL=[],items=[],pts=[],S=0,Vw=0,Vh=0,y=0,t0=0,paused=false,running=false,seq=0,lastPick=-1,shown=null;
// items: {el,x,y,m} in units of S (photo size); pts: the line, [x,y] in units of S. Units of S so a resize keeps everything joined.
function dirNow(){return MAN||DIR==="auto"?"down":DIR}
function photoSize(){if(MM)return MM*PPMM;if(SIZE)return SIZE;return Vw<=400?Math.min(Vw*.6,250):Vw<768?Math.min(Vw*.5,300):Vw<=900?400:500}   // homepage's --image-size rules
function layout(){
  const d=dirNow(),W=innerWidth,H=innerHeight,side=d==="left"||d==="right",old=S;
  Vw=side?H:W;Vh=side?W:H;if(MAN)Vh=Math.max(H,screen.height||H);S=photoSize();root.style.width=Vw+"px";root.style.height=Vh+"px";
  root.style.transform=d==="down"?"":d==="right"?`translate(0,${H}px) rotate(-90deg)`:d==="left"?`translate(${W}px,0) rotate(90deg)`:`translate(${W}px,${H}px) rotate(180deg)`;
  if(old){y*=S/old;y0*=S/old}items.forEach(place)}
function place(it){const e=it.el;e.style.width=e.style.height=S+"px";e.style.left=it.x*S+"px";e.style.top=it.y*S+"px"}
function pick(){
  if(FLOW||!items.length&&FIRST){let i=FLOW?seq%POOL.length:POOL.findIndex(m=>m.n.replace(/\.jpe?g$/i,"")===FIRST);if(!FLOW&&i<0)i=0;if(FLOW&&!seq&&FIRST){const k=POOL.findIndex(m=>m.n.replace(/\.jpe?g$/i,"")===FIRST);if(k>0)seq=i=k}return i}
  let i;do{i=Math.floor(Math.random()*POOL.length)}while(POOL.length>1&&i===lastPick);return i}
function add(){
  const i=pick(),m=POOL[i];lastPick=i;seq++;const end=pts.length?pts[pts.length-1]:[0,0];
  const L=m.q&&m.q.length>1?m.q:[[m.p[0],m.p[1]],[m.p[2],m.p[3]]];   // the line inside this photo: Hal-approved trace, else straight entry to exit
  const it={m,x:end[0]-L[0][0],y:end[1]-L[0][1]};   // this photo's entry point sits on the last photo's exit point
  if(!pts.length)pts.push([end[0],end[1]]);for(let k=1;k<L.length;k++)if(it.y+L[k][1]>pts[pts.length-1][1])pts.push([it.x+L[k][0],it.y+L[k][1]]);
  const e=document.createElement("img");e.alt="";e.decoding="async";e.draggable=false;e.onload=()=>e.classList.add("on");e.src=m.src;it.el=e;place(it);strip.append(e);items.push(it)}
function lineX(yy){   // x of the line at height yy (units of S)
  if(yy<=pts[0][1])return pts[0][0];
  for(let k=1;k<pts.length;k++)if(yy<=pts[k][1]){const a=pts[k-1],b=pts[k];return a[0]+(b[0]-a[0])*(yy-a[1])/(b[1]-a[1])}
  return pts[pts.length-1][0]}
function pinX(yy){if(!SMOOTH)return lineX(yy);const n=Math.max(3,Math.ceil(SMOOTH/3)),w=SMOOTH/S;let s=0,t=0;   // weighted average of the line over +-SMOOTH px of travel, sampled every ~3 px, so small zig-zags in a trace do not shake the picture
  for(let k=-n;k<=n;k++){const g=1-Math.abs(k)/(n+1);s+=g*lineX(yy+k*w/n);t+=g}return s/t}
function manage(){
  const top=y/S,need=top+(Vh/S)*(TILT?8:1)+2;let guard=0;
  while(pts[pts.length-1][1]<need&&guard++<40)add();
  while(items.length>3&&items[0].y+1<top-KEEP){items.shift().el.remove()}
  while(pts.length>3&&pts[1][1]<top-KEEP-1)pts.shift()}
function caption(){
  if(!INFO)return;const mid=(y+(MAN?innerHeight:Vh)/2)/S;let best=null,bd=1e9;for(const it of items){const d=Math.abs(it.y+.5-mid);if(d<bd){bd=d;best=it}}
  if(!best||best===shown)return;shown=best;const m=best.m;const a=[];if(m.t)a.push(m.t);if(m.c&&m.c.length===2)a.push(`(${m.c[0].toFixed(4)}, ${m.c[1].toFixed(4)})`);
  info.textContent="";const d1=document.createElement("div");a.forEach((t,i)=>{const sp=document.createElement("span");sp.textContent=t;if(i)d1.append(" ");d1.append(sp)});info.append(d1);if(m.l){const d2=document.createElement("div");d2.textContent=m.l;info.append(d2)}}
function draw(){manage();strip.style.transform=`translate3d(${Vw/2+CX-pinX(y/S)*S}px,${-y}px,0)`;caption();
  if(DEBUG)dbg.textContent=`dir ${dirNow()}  size ${S.toFixed(0)}px  speed ${SPD}${MAN?" manual":""}  photos ${items.length}  ${shown?shown.m.n:""}\nscreen ${innerWidth}x${innerHeight}  dpr ${devicePixelRatio}`}
// scroll=manual: the document itself scrolls (a tall spacer), the stage stays fixed and is drawn from the scroll position. A finger scroll is what lets Safari shrink its bars.
let y0=0,yb=0,exp=0,lastUser=-1e9,touching=false,swiped=false,hint=null;
function manFrame(now,dt){
  const sy=scrollY;if(Math.abs(sy-exp)>.75){lastUser=now;exp=sy;if(!swiped&&sy>4){swiped=true;if(hint)hint.remove()}}   // the page moved and it was not us: the visitor is scrolling
  if(running&&!paused&&!touching&&now-lastUser>900){exp+=SPD*dt;if(exp>SPACER-innerHeight*3){yb+=exp;exp=0}scrollTo(0,exp)}
  y=y0+yb+exp}
let last=0;
function frame(now){
  if(!last)last=now;const dt=Math.min(.1,(now-last)/1000);last=now;
  if(POOL.length&&(MAN||!paused)){if(!running){if((now-t0)/1000>=HOLD)running=true}else if(!MAN)y+=SPD*dt;if(MAN)manFrame(now,dt);draw()}
  requestAnimationFrame(frame)}
let wl=null,left=false;async function wake(){if(left)return;if(document.visibilityState!=="visible"){if(wl){wl.release().catch(()=>{});wl=null}return}try{if("wakeLock"in navigator&&document.visibilityState==="visible")wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);addEventListener("pointerdown",()=>{wake()});
addEventListener("resize",()=>{layout();if(POOL.length)draw()});
addEventListener("dblclick",()=>{paused=!paused});
// Way out to Hal's other pages: nothing on screen until a tap, then a small label for 5 s (Hal 2026-11-14: hidden page, but people can go on from it).
// Hal 2026-11-20: on the live site this is the site's own menu (/assets/js/site.js: MENU bar + "Hal Xing" on phones, sidebar on desktop), hidden until a tap,
// shown for 6 s, kept while it is open. Where site.js is not there (the tailnet copy) the small label above stays the way out.
const out=document.getElementById("out");let outT=0;
const menuOpen=()=>!!document.querySelector(".mobile-menu.expanded"),hideOut=()=>{if(menuOpen()){outT=setTimeout(hideOut,2000);return}document.body.classList.remove("menu-on");out.classList.remove("on")};
addEventListener("click",e=>{if(e.target.closest("#out a,.sidebar,.mobile-menu"))return;
  if(document.body.classList.contains("has-site-nav"))document.body.classList.add("menu-on");else out.classList.add("on");clearTimeout(outT);outT=setTimeout(hideOut,6000)});
if(MAN){document.documentElement.classList.add("man");const sp=document.createElement("div");sp.style.height=SPACER+"px";document.body.append(sp);
  hint=document.createElement("div");hint.id="hint";hint.textContent="swipe up \u2191";document.body.append(hint);
  addEventListener("touchstart",()=>{touching=true},{passive:true});const up=()=>{touching=false;lastUser=performance.now()};addEventListener("touchend",up,{passive:true});addEventListener("touchcancel",up,{passive:true});
  if(window.visualViewport)visualViewport.addEventListener("resize",()=>{layout();if(POOL.length)draw()})}
// fs=1: full screen only on the visitor's own first tap, never asked for again. Leaving: the x, the system back gesture or swipe, or Esc. Nothing touches history or orientation. The wake lock is let go on leaving.
if(Q.get("fs")==="1"){const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;let asked=false;
  const x=document.createElement("button");x.id="fsx";x.textContent="\u00d7";x.setAttribute("aria-label","Leave full screen");root.append(x);
  x.addEventListener("click",e=>{e.stopPropagation();if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document)});
  addEventListener("click",e=>{if(asked||!rq||e.target.closest("#out a,#fsx,.sidebar,.mobile-menu"))return;asked=true;try{const p=rq.call(el,{navigationUI:"hide"});if(p&&p.catch)p.catch(()=>{})}catch(_){}});
  const ch=()=>{const on=!!fsEl();x.classList.toggle("on",on);if(!on&&asked){left=true;if(wl){wl.release().catch(()=>{});wl=null}}};document.addEventListener("fullscreenchange",ch);document.addEventListener("webkitfullscreenchange",ch)}
// bar=black|white|hex: theme-color, the page background behind the stage, and a 3 px fixed line at the very top, so whichever of the three the browser reads for its top strip gives this colour.
if(Q.get("bar")){const v=Q.get("bar"),c=v==="black"?"#000000":v==="white"?"#ffffff":"#"+v.replace("#","");document.querySelector('meta[name="theme-color"]').setAttribute("content",c);
  document.documentElement.style.background=document.body.style.background=c;const b=document.createElement("div");b.style.cssText=`position:fixed;left:0;top:0;width:100%;height:3px;background:${c};z-index:9;pointer-events:none`;document.body.append(b)}
if(Q.get("under")==="1")root.style.top="calc(-1 * env(safe-area-inset-top))";
const load=fetch("meta.json").then(r=>r.json()).then(j=>Object.keys(j).filter(n=>!ONLY||j[n].q).map(n=>Object.assign({n,c:[],l:"",t:""},j[n],{src:"img/"+(j[n].f||n+".jpg")})));
load.then(P=>{POOL=P;if(!POOL.length){dbg.textContent="no approved photos yet";return}layout();
  if(DEBUG){const m=document.createElement("div");m.className="mk";m.style.cssText=`left:calc(50% + ${CX}px);top:0;width:1px;height:30px`;root.append(m)}
  add();y=y0=pts[0][1]*S;t0=performance.now();draw();wake();requestAnimationFrame(frame)}).catch(()=>{dbg.textContent="could not load"});
</script>
<script src="/assets/js/site.js"></script></body></html>
